<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin:0; overflow:hidden; background:transparent; }
#pet { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:70px; image-rendering:pixelated; }
.bubble {
  position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
  background:rgba(255,182,193,0.95); border-radius:10px; padding:6px 10px;
  font:11px sans-serif; color:#8a4a5a; white-space:nowrap; display:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.15); border:2px solid #ff9db0;
}
.bubble::after {
  content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
  border-left:6px solid transparent; border-right:6px solid transparent;
  border-top:6px solid #ff9db0;
}
@keyframes blink { 0%,92%,100% { transform:scaleY(1);} 96% { transform:scaleY(0.1);} }
@keyframes idle { 0%,100% { transform:translateY(0);} 50% { transform:translateY(-6px);} }
@keyframes talk { 0%,100% { transform:scaleY(1);} 50% { transform:scaleY(0.3);} }
.eye { animation: blink 4s infinite; transform-origin:center; transform-box:fill-box; }
#body { animation: idle 3s ease-in-out infinite; }
#mouth { animation: talk 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
</style>
</head>
<body>
<div class="bubble" id="bubble"></div>
<svg id="pet" viewBox="0 0 200 200">
  <g id="body">
    <!-- 白色方脸+身体一体（参考图：白方块，头身相连） -->
    <rect id="bodyOuter" x="10" y="30" width="180" height="120" rx="10" fill="#ffffff" stroke="#4a4a4f" stroke-width="3"/>
    <!-- 左耳：灰色三角形 -->
    <path id="earL" d="M34 10 L14 36 L58 36 Z" fill="#c8c6ca" stroke="#4a4a4f" stroke-width="3" stroke-linejoin="round"/>
    <!-- 右耳：米黄色三角形 -->
    <path id="earR" d="M166 10 L186 36 L142 36 Z" fill="#f3d2a3" stroke="#8a6a44" stroke-width="3" stroke-linejoin="round"/>
    <!-- 左侧灰色脸颊块 -->
    <path d="M13 38 h43 a7 7 0 0 1 7 7 v18 a7 7 0 0 1 -7 7 h-43 z" fill="#c8c6ca" stroke="#4a4a4f" stroke-width="2.5"/>
    <!-- 右侧米黄色脸颊块 -->
    <path d="M187 38 h-43 a7 7 0 0 0 -7 7 v18 a7 7 0 0 0 7 7 h43 z" fill="#f3d2a3" stroke="#8a6a44" stroke-width="2.5"/>
    <!-- 眼睛：黑色大竖条（参考图2x4竖条大眼睛） -->
    <rect class="eye" x="40" y="64" width="26" height="44" rx="8" fill="#222222"/>
    <rect class="eye" x="118" y="64" width="26" height="44" rx="8" fill="#222222"/>
    <!-- 腮红：粉色 -->
    <rect x="16" y="100" width="18" height="16" rx="4" fill="#ff9db0"/>
    <rect x="150" y="100" width="18" height="16" rx="4" fill="#ff9db0"/>
    <!-- 像素小嘴（会动） -->
    <path id="mouth" d="M84 122 h10 v-8 h12 v8 h10" stroke="#8a4a5a" stroke-width="4" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect id="bodyInner" x="70" y="136" width="60" height="10" fill="#f0f0f0"/>
  </g>
</svg>
<script>
// petEngine:由OverlayService通过evaluateJavascript调用
var currentState = { heat: 50, valence: 0, arousal: 0, mood: 'normal' };
window.petEngine = {
  onTap: function() { say("喵？"); },
  onDoubleTap: function() { say("嘿嘿，摸我啦 ♥"); bounce(); },
  onLongPress: function() { hide(); say("……躲起来了"); },
  say: say,
  setState: function(s) {
    if (!s) return;
    if (s.heat != null) currentState.heat = s.heat;
    if (s.valence != null) currentState.valence = s.valence;
    if (s.arousal != null) currentState.arousal = s.arousal;
    if (s.mood) currentState.mood = s.mood;
    applyState();
  },
  showCloud: function(text) { say(text); }
};
var bubble = document.getElementById('bubble');
var pet = document.getElementById('pet');
var bodyOuter = document.getElementById('bodyOuter');
var bodyInner = document.getElementById('bodyInner');
var mouth = document.getElementById('mouth');
function applyState() {
  // heat 驱动体色：低→冷灰白，中→纯白，高→暖粉白
  var h = currentState.heat;
  var outer, inner;
  if (h < 30) { outer = '#c8d0d8'; inner = '#dde4ea'; }
  else if (h > 70) { outer = '#ffd9d9'; inner = '#ffe9e9'; }
  else { outer = '#ffffff'; inner = '#f0f0f0'; }
  bodyOuter.setAttribute('fill', outer);
  bodyInner.setAttribute('fill', inner);
  // mood 驱动像素嘴型（阶梯折线）
  switch (currentState.mood) {
    case 'happy': mouth.setAttribute('d', 'M84 124 h6 v-6 h20 v6 h6'); break;
    case 'sad': mouth.setAttribute('d', 'M84 118 h6 v6 h20 v-6 h6'); break;
    case 'angry': mouth.setAttribute('d', 'M84 122 h32'); break;
    default: mouth.setAttribute('d', 'M84 122 h10 v-8 h12 v8 h10'); break;
  }
}
function say(text) {
  bubble.textContent = text;
  bubble.style.display = 'block';
  setTimeout(function(){ bubble.style.display = 'none'; }, 2000);
}
function bounce() {
  pet.style.animation = 'none';
  pet.style.transition = 'transform 0.3s';
  pet.style.transform = 'translateX(-50%) scale(1.15)';
  setTimeout(function(){ pet.style.transform = 'translateX(-50%) scale(1)'; }, 300);
}
function hide() {
  pet.style.opacity = '0';
  pet.style.transition = 'opacity 0.5s';
  setTimeout(function(){ pet.style.opacity = '1'; pet.style.transition='none'; }, 1500);
}
</script>
</body>
</html>
